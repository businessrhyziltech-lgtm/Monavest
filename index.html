/* MONAVEST MOTION SYSTEM */
:root{scroll-behavior:smooth}
body{background:
 radial-gradient(ellipse at 8% 4%,rgba(24,133,112,.20),transparent 34%),
 radial-gradient(ellipse at 95% 35%,rgba(15,90,103,.18),transparent 32%),
 radial-gradient(ellipse at 45% 100%,rgba(14,103,75,.13),transparent 36%),
 #040e13;background-attachment:fixed}
body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:-1;border-radius:50%;filter:blur(2px)}
body:before{width:340px;height:340px;left:-180px;top:15%;background:radial-gradient(circle,#1bcf9b18,transparent 70%);animation:ambientDrift 17s ease-in-out infinite alternate}
body:after{width:420px;height:420px;right:-230px;bottom:4%;background:radial-gradient(circle,#168b9a18,transparent 70%);animation:ambientDrift 21s ease-in-out infinite alternate-reverse}
.phone{isolation:isolate;background:linear-gradient(155deg,rgba(6,23,29,.97),rgba(4,14,19,.985));}
.phone:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;opacity:.25;background-image:radial-gradient(#72e7c0 0.65px,transparent .65px);background-size:23px 23px;mask-image:linear-gradient(to bottom,black,transparent 72%)}
.screen,.auth-screen{animation:screenEnter .55s cubic-bezier(.2,.8,.2,1) both}
.screen>*{animation:riseIn .55s both}
.screen>*:nth-child(2){animation-delay:.045s}.screen>*:nth-child(3){animation-delay:.09s}.screen>*:nth-child(4){animation-delay:.135s}.screen>*:nth-child(5){animation-delay:.18s}
@keyframes screenEnter{from{opacity:0;filter:blur(7px);transform:translateY(12px) scale(.99)}to{opacity:1;filter:blur(0);transform:translateY(0) scale(1)}}
@keyframes riseIn{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}
@keyframes ambientDrift{from{transform:translate3d(0,-15px,0) scale(.9)}to{transform:translate3d(40px,35px,0) scale(1.18)}}
.logo-mark{animation:logoEntrance .9s cubic-bezier(.16,1,.3,1) both}
.logo-m{animation:monavestGlow 3s ease-in-out infinite,logoFloat 4.5s ease-in-out infinite}
.logo-orbit{animation:monavestOrbit 4s ease-in-out infinite,orbitPulse 3s ease-in-out infinite}
.logo-mark:after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,#2bd39a20,transparent 68%);z-index:-1;animation:haloPulse 3s ease-in-out infinite}
@keyframes logoEntrance{from{opacity:0;transform:translateY(18px) scale(.72);filter:blur(8px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes logoFloat{0%,100%{translate:0 0}50%{translate:0 -4px}}
@keyframes orbitPulse{0%,100%{filter:drop-shadow(0 0 2px #2bd39a)}50%{filter:drop-shadow(0 0 10px #2bd39a)}}
@keyframes haloPulse{0%,100%{transform:scale(.8);opacity:.4}50%{transform:scale(1.25);opacity:1}}
.auth-screen{position:relative;overflow:hidden}
.auth-screen:before{content:"";position:absolute;width:270px;height:270px;border-radius:50%;top:24%;left:50%;transform:translateX(-50%);background:radial-gradient(circle,#20c9910e,transparent 68%);pointer-events:none}
.auth-screen>*{position:relative}
.btn,.iconbtn,.tile,.listrow,.nav button,.round-icon{transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .22s,background .22s,box-shadow .22s}
.btn{position:relative;overflow:hidden}
.btn:before{content:"";position:absolute;top:-70%;left:-55%;width:35%;height:240%;transform:rotate(25deg);background:linear-gradient(90deg,transparent,#ffffff55,transparent);transition:left .65s}
.btn:hover:before{left:130%}
.btn-primary{box-shadow:0 8px 25px #22c98d22,inset 0 1px #ffffff45}
.btn-primary:hover{box-shadow:0 10px 32px #22c98d42;filter:saturate(1.12);transform:translateY(-2px)}
.btn-secondary:hover,.iconbtn:hover{border-color:#36cfa0;background:#153a3b;transform:translateY(-2px)}
.tile:hover,.glass:hover{border-color:#347767;box-shadow:0 12px 35px #0004,0 0 22px #21c9910b}
.listrow{transition:background .2s,padding .2s,border-color .2s}
.listrow:hover{background:#102b32;padding-left:8px;padding-right:8px;border-radius:10px}
.round-icon{box-shadow:inset 0 1px #ffffff12,0 4px 12px #0002}
button:active .round-icon{transform:scale(.9)}
.stat{background:linear-gradient(90deg,#f0fff9,#7deac2 55%,#eafff7);background-clip:text;-webkit-background-clip:text;color:transparent}
.glass{position:relative;overflow:hidden}
.glass:after{content:"";position:absolute;top:-80%;left:-60%;width:45%;height:260%;transform:rotate(25deg);background:linear-gradient(90deg,transparent,#ffffff0b,transparent);animation:glassSweep 7s ease-in-out infinite}
@keyframes glassSweep{0%,58%{left:-70%}82%,100%{left:140%}}
.cardvisual{box-shadow:0 16px 38px #0005,0 0 30px #19bd9412;transform:perspective(800px) rotateX(0deg);transition:transform .35s,box-shadow .35s}
.cardvisual:hover{transform:perspective(800px) rotateX(3deg) rotateY(-3deg) translateY(-4px);box-shadow:0 22px 48px #0007,0 0 35px #19bd9422}
.cardvisual:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,#ffffff13 48%,transparent 68%);transform:translateX(-110%);animation:cardShine 6s ease-in-out infinite}
@keyframes cardShine{0%,55%{transform:translateX(-110%)}85%,100%{transform:translateX(110%)}}
.pill{box-shadow:0 0 15px #2bd39a14}
.nav{box-shadow:0 -12px 32px #0003}
.nav button{padding:4px 0;border-radius:12px}
.nav button.active svg{filter:drop-shadow(0 0 6px #2bd39a88);animation:navPop .28s ease-out}
.nav button.active span{font-weight:750}
@keyframes navPop{from{transform:translateY(4px) scale(.8)}to{transform:translateY(0) scale(1)}}
.modalback{animation:fadeIn .2s ease-out;backdrop-filter:blur(7px)}
.modal{animation:modalUp .32s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalUp{from{opacity:0;transform:translateY(45px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.toast{animation:toastIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,15px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.field{transition:border-color .2s,box-shadow .2s,background .2s}
.field:focus{background:#0d2730}
.iconbtn:active,.tile:active,.listrow:active{transform:scale(.985)}
#fakeqr span{border-radius:1px}
@media(min-width:600px){body{padding:24px 0}.phone{min-height:calc(100dvh - 48px);border:1px solid #24434c;border-radius:28px;overflow:hidden}.screen{min-height:calc(100dvh - 126px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}


/* UIVERSE-INSPIRED AUTH FORMS */
.auth-screen{align-items:center;justify-content:flex-start;gap:0;padding:28px 18px 36px;min-height:100dvh}
.auth-screen>.text-center:first-child{margin-bottom:20px}
.auth-screen .logo-mark{margin-top:2px}
.auth-card{width:min(100%,450px);margin:14px auto 0;padding:30px;background:#fff;border-radius:20px;color:#151717;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 55px #0005;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.auth-card .auth-heading{font-size:22px;font-weight:750;letter-spacing:-.5px;color:#151717;margin:0 0 2px}
.auth-card .auth-subtitle{font-size:13px;color:#707777;margin:0 0 12px}
.auth-card .flex-column{display:flex;flex-direction:column;gap:7px}
.auth-card .flex-column>label{color:#151717;font-size:14px;font-weight:600}
.auth-card .inputForm{border:1.5px solid #ecedec;border-radius:10px;height:50px;display:flex;align-items:center;padding:0 12px;gap:9px;transition:.2s ease-in-out;background:#fff}
.auth-card .inputForm:focus-within{border:1.5px solid #2d79f3;box-shadow:0 0 0 3px #2d79f315}
.auth-card .inputForm>svg{width:19px;height:19px;flex-shrink:0;fill:#151717}
.auth-card .inputForm input{border:0;outline:0;width:100%;height:100%;min-width:0;color:#151717;background:transparent;font-size:14px}
.auth-card .inputForm input::placeholder{color:#9a9f9f}
.auth-card .password-toggle{border:0;background:transparent;color:#555;display:grid;place-items:center;padding:5px}
.auth-card .password-toggle svg{width:19px;height:19px;fill:#555}
.auth-card .flex-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 4px}
.auth-card .remember{display:flex;align-items:center;gap:7px;color:#333;font-size:13px}
.auth-card .remember input,.auth-card .terms input{accent-color:#151717}
.auth-card .auth-link{border:0;background:none;padding:0;color:#2d79f3;font-size:13px;font-weight:600;cursor:pointer}

.auth-card .auth-divider:before,.auth-card .auth-divider:after{content:"";height:1px;background:#e8eaea;flex:1}
.auth-card .social-row{display:flex;gap:10px}
.auth-card .social-btn{margin-top:4px;width:100%;height:48px;border-radius:10px;display:flex;justify-content:center;align-items:center;gap:9px;border:1px solid #ededef;background:#fff;color:#222;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.auth-card .social-btn:hover{border-color:#2d79f3;background:#fafcff}
.auth-card .social-btn img{width:20px;height:20px;object-fit:contain}
.auth-card .terms{display:flex;align-items:flex-start;gap:8px;color:#555;font-size:12px;line-height:1.5;margin:4px 0}
.auth-card .terms input{margin-top:2px;flex-shrink:0}

};
let data=JSON.parse(localStorage.getItem('monavestData')||'null')||{name:'Rhyzil Angelo',email:'rhyzil@example.com',balance:24580.32,accounts:[{name:'Savings Account',number:'•••• 4582',balance:12340},{name:'Current Account',number:'•••• 2168',balance:5216.78},{name:'Daily Savings & Investments',number:'•••• 9456',balance:7023.54}],transactions:[{type:'Money Received',detail:'From Jayson Dela Cruz',amount:1500,date:'Today, 09:24 AM',positive:true},{type:'Payment Sent',detail:'To Shopee',amount:899,date:'Yesterday, 06:12 PM',positive:false},{type:'Deposit',detail:'Monthly savings',amount:2000,date:'Nov 20, 03:30 PM',positive:true},{type:'Bill Payment',detail:'Electricity',amount:1350,date:'Nov 19, 11:10 AM',positive:false}],cardLocked:false,cardNumber:'4582'};

function verify(){return `<section class="auth-screen">${header('Verify Your Account',false)}<p class="muted text-xs mb-8">Enter the 6-digit code sent to your registered mobile number.</p><div class="flex gap-2 mb-8">${[1,2,3,4,5,6].map(i=>`<input maxlength="1" id="otp${i}" class="field text-center text-xl font-bold px-0" inputmode="numeric">`).join('')}</div><p class="text-center muted text-xs mb-8">Didn't receive the code? <button class="text-emerald-300" onclick="toast('A new demo code was generated: 123456')">Resend (30s)</button></p><button class="btn btn-primary w-full mt-auto" onclick="verifyAction()">Verify</button></section>`}
function topbar(){return `<div class="flex items-center justify-between mb-5"><div class="flex items-center gap-2"><div class="w-9 h-9 rounded-full bg-gradient-to-br from-emerald-300 to-teal-700 grid place-items-center text-xs font-bold text-slate-950">RA</div><div><div class="text-[10px] muted">Good evening,</div><div class="text-sm font-bold">${data.name.split(' ')[0]}</div></div></div><button class="iconbtn" onclick="toast('You’re all caught up!')">♧</button></div>`}
function balanceCard(){return `<div class="glass rounded-2xl p-4 mb-5"><div class="flex justify-between"><span class="small-label">Total Balance</span><button class="text-xs text-emerald-300" onclick="showBalance=!showBalance;render()">◉</button></div><div class="stat mt-1">${showBalance?money(data.balance):'₱ ••••••'}</div><div class="text-[10px] text-emerald-300 mt-1">↗ +4.2% this month</div><div class="flex gap-3 mt-5">${[['↗','Send','transfer'],['↓','Receive','receive'],['＋','Top Up','topup'],['▣','More','accounts']].map(x=>`<button class="flex-1 text-center" onclick="action('${x[2]}')"><div class="round-icon mx-auto mb-1">${x[0]}</div><span class="text-[10px]">${x[1]}</span></button>`).join('')}</div></div>`}
function transactionRows(items){return items.map((t,i)=>`<div class="listrow"><div class="round-icon">${t.positive?'↓':'↑'}</div><div class="flex-1 min-w-0"><div class="text-xs font-semibold">${t.type}</div><div class="text-[10px] muted truncate">${t.detail} · ${t.date}</div></div><div class="text-xs font-bold ${t.positive?'text-emerald-300':'text-slate-100'}">${t.positive?'+':'−'}${money(t.amount)}</div></div>`).join('')||'<p class="muted text-xs py-5">No transactions found.</p>'}
function home(){return `${topbar()}${balanceCard()}<div class="flex justify-between items-center mb-2"><h3 class="section-title">Recent Activity</h3><button class="text-xs text-emerald-300" onclick="goTab('history')">See All</button></div>${transactionRows(data.transactions.slice(0,4))}<div class="tile mt-5 flex justify-between items-center"><div><div class="text-xs font-bold">Make your money grow</div><div class="small-label mt-1">Explore investment options</div></div><button class="btn btn-primary text-[11px] py-2" onclick="goTab('invest')">Explore</button></div>`}
function accounts(){return `${header('Accounts',false)}<div class="glass rounded-2xl p-4 mb-4"><div class="small-label">Total Wallet</div><div class="stat">${money(data.balance)}</div><div class="small-label mt-1">•••• ${data.cardNumber}</div></div><div class="flex justify-between mb-2"><h3 class="section-title">My Accounts</h3><button class="text-emerald-300 text-xs" onclick="addAccount()">＋ Add New</button></div>${data.accounts.map((a,i)=>`<button class="tile w-full flex items-center text-left mb-3" onclick="accountDetail(${i})"><div class="round-icon">▣</div><div class="flex-1"><div class="text-xs font-bold">${a.name}</div><div class="small-label mt-1">${a.number}</div></div><div class="text-right"><div class="text-xs font-bold">${money(a.balance)}</div><div class="small-label">›</div></div></button>`).join('')}` }
function cards(){return `${header('Cards',false)}<div class="cardvisual mb-5"><div class="flex justify-between items-center"><div class="font-bold text-sm">MΛ Monavest</div><span class="text-[9px]">monavest</span></div><div class="text-2xl tracking-[.2em] mt-8">▦</div><div class="flex justify-between items-end mt-5"><div><div class="text-xs tracking-widest">•••• •••• •••• ${data.cardNumber}</div><div class="text-[9px] mt-2">RHYZIL ANGELO</div></div><div class="italic text-xl font-black">VISA</div></div></div><div class="grid grid-cols-3 gap-2 mb-6"><button class="tile text-center" onclick="toast('Add card is not connected to a bank.')"><div class="text-emerald-300 text-lg">＋</div><div class="text-[10px] mt-1">Add Card</div></button><button class="tile text-center" onclick="toast('PIN management is not connected.')"><div class="text-emerald-300 text-lg">◉</div><div class="text-[10px] mt-1">Set PIN</div></button><button class="tile text-center" onclick="toast('You have one demo card.')"><div class="text-emerald-300 text-lg">▣</div><div class="text-[10px] mt-1">Manage Cards</div></button></div><h3 class="section-title mb-2">Card Settings</h3><button class="listrow w-full text-left" onclick="toggleCard()"><span class="text-sm flex-1">${data.cardLocked?'Unlock your card':'Lock your card'}</span><span class="small-label">${data.cardLocked?'Locked':'Active'}</span></button>${[['Change PIN','Update your card PIN'],['Card Controls','Manage spending controls'],['Request Replacement','Replace a damaged card']].map(x=>`<button class="listrow w-full text-left" onclick="toast('${x[0]} is not connected to a bank.')"><span class="text-sm flex-1">${x[0]}</span><span class="small-label">›</span></button>`).join('')}`}
function toggleCard(){data.cardLocked=!data.cardLocked;save();render();toast(data.cardLocked?'Card locked':'Card unlocked')}
function invest(){return `${header('Invest',false)}<div class="tile mb-5"><div class="text-sm font-bold">Grow your wealth with Monavest Invest</div><p class="small-label mt-2">Explore goal-based investing and learn about different options.</p><button class="btn btn-primary w-full mt-4" onclick="toast('Investment options are educational simulations only.')">Explore Investment Options</button></div><h3 class="section-title mb-3">Investment Products</h3>${[['🟨','Time Deposit','Earn fixed returns over a set term'],['📈','Mutual Funds','Diversified investment options'],['🟩','Stocks','Invest in listed companies']].map(x=>`<button class="listrow w-full text-left" onclick="investmentInfo('${x[1]}')"><span class="round-icon">${x[0]}</span><span class="flex-1"><b class="text-xs">${x[1]}</b><span class="block small-label mt-1">${x[2]}</span></span><span>›</span></button>`).join('')}` }
function history(){let items=data.transactions.filter(t=>filter==='All'||(filter==='Received'&&t.positive)||(filter==='Sent'&&!t.positive));return `${header('Transaction History',false)}<div class="flex gap-2 mb-4">${['All','Received','Sent'].map(f=>`<button class="px-4 py-2 rounded-full text-xs ${filter===f?'green':'bg-slate-800 text-slate-300'}" onclick="filter='${f}';render()">${f}</button>`).join('')}</div>${transactionRows(items)}` }
function profile(){return `${header('Profile & Settings',false)}<div class="flex items-center gap-3 tile mb-5"><div class="w-12 h-12 rounded-full bg-gradient-to-br from-emerald-300 to-teal-700 text-slate-950 grid place-items-center font-bold">RA</div><div><div class="text-sm font-bold">${data.name}</div><div class="small-label">${data.email}</div></div></div><h3 class="section-title mb-2">Account Settings</h3>${[['Personal Information','Edit your profile'],['Security & Privacy','Password and security'],['Notifications','Manage alerts'],['Linked Accounts','Connected accounts'],['Help & Support','Get assistance'],['About Monavest','App information']].map((x,i)=>`<button class="listrow w-full text-left" onclick="settingsAction('${x[0]}')"><span class="round-icon">${['♙','♧','♢','▣','?','ⓘ'][i]}</span><span class="flex-1"><b class="text-xs">${x[0]}</b><span class="block small-label mt-1">${x[1]}</span></span><span>›</span></button>`).join('')}<button class="btn w-full mt-6 border border-rose-900/70 text-rose-300" onclick="logout()">Log Out</button>`}
function render(){let app=$('#app');if(['welcome','login','signup','verify'].includes(page)){app.innerHTML=({welcome,login,signup,verify})[page]();return}let content=({home,accounts,cards,invest,history,profile})[tab]();app.innerHTML=`<section class="screen">${content}</section><nav class="nav">${[['home','Home'],['cards','Cards'],['invest','Invest'],['history','History'],['profile','More']].map(([k,n])=>`<button class="${tab===k?'active':''}" onclick="goTab('${k}')">${icons[k==='cards'?'wallet':k==='invest'?'chart':k==='history'?'list':k==='profile'?'user':'home']}<span>${n}</span></button>`).join('')}</nav>`}
function goTab(t){tab=t;render()}
function toggleAuthPassword(id,button){let field=document.getElementById(id);if(!field)return;field.type=field.type==='password'?'text':'password';button.setAttribute('aria-label',field.type==='password'?'Show password':'Hide password')}
function loginAction(){let e=$('#loginEmail').value,p=$('#loginPass').value;if(!e||!p){toast('Enter your email or mobile number and password.');return}page='verify';render()}
function signupAction(){let n=$('#suName').value,e=$('#suEmail').value,p=$('#suPass').value,c=$('#suConfirm').value;if(!n||!e||!p){toast('Please complete the required fields.');return}if(p!==c){toast('Passwords do not match.');return}if(!$('#terms').checked){toast('Please accept the Terms and Privacy Policy.');return}data.name=n;data.email=e;save();page='verify';render()}
function verifyAction(){let code=[1,2,3,4,5,6].map(i=>$('#otp'+i)?.value||'').join('');if(code!=='123456'){toast('For this local demo, enter 123456.');return}page='app';tab='home';render();toast('Welcome to Monavest!')}
function logout(){page='login';render();toast('You have been logged out.')}
function modal(title,body){$('#overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="flex justify-between items-center mb-5"><h3 class="font-bold">${title}</h3><button class="iconbtn" onclick="closeModal()">×</button></div>${body}</div></div>`}
function closeModal(){$('#overlay').innerHTML=''}
function action(a){if(a==='transfer')transfer();if(a==='receive')receive();if(a==='topup')topup();if(a==='accounts'){goTab('accounts')}}
function transfer(){modal('Transfer Money',`<label class="block mb-4"><span class="small-label block mb-2">From</span><select id="fromAcc" class="field">${data.accounts.map((a,i)=>`<option value="${i}">${a.name} · ${a.number}</option>`).join('')}</select></label>${input('To','Enter account name or number','text','toName')}${input('Amount','₱ 0.00','number','transferAmount')}${input('Description (Optional)','e.g. Rent, Food, Transfer','text','transferDesc')}<button class="btn btn-primary w-full mt-2" onclick="confirmTransfer()">Continue</button><p class="small-label mt-3">Demo only: transfers update this browser's sample balance and do not send real money.</p>`)}
function confirmTransfer(){let i=Number($('#fromAcc').value),to=$('#toName').value,amt=Number($('#transferAmount').value);if(!to||!amt||amt<=0){toast('Enter a recipient and valid amount.');return}if(amt>data.accounts[i].balance){toast('Insufficient demo account balance.');return}modal('Confirm Transfer',`<div class="tile mb-4"><div class="small-label">Sending to</div><div class="font-bold mt-1">${to}</div><div class="small-label mt-4">Amount</div><div class="stat">${money(amt)}</div></div><button class="btn btn-primary w-full" onclick="completeTransfer(${i},'${to.replace(/'/g,"")} ',${amt})">Confirm Transfer</button><button class="btn btn-secondary w-full mt-2" onclick="transfer()">Back</button>`)}
function completeTransfer(i,to,amt){data.accounts[i].balance-=amt;data.balance-=amt;data.transactions.unshift({type:'Payment Sent',detail:'To '+to.trim(),amount:amt,date:'Just now',positive:false});save();closeModal();render();toast('Demo transfer completed. No real money was sent.')}
function receive(){modal('Receive Money',`<div class="tile text-center py-7"><div class="w-36 h-36 mx-auto bg-white rounded-xl p-3 grid grid-cols-7 gap-1" id="fakeqr">${Array.from({length:49},(_,i)=>`<span style="background:${(i*7+i*i)%5<2?'#06151b':'white'}"></span>`).join('')}</div><div class="font-bold mt-4">${data.name}</div><div class="small-label mt-1">Monavest Account · •••• ${data.cardNumber}</div></div><button class="btn btn-primary w-full mt-4" onclick="copyText('Monavest account •••• ${data.cardNumber}')">Copy Account Details</button>`)}
function copyText(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('Copied to clipboard')).catch(()=>toast(t));else toast(t)}
function topup(){modal('Top Up Wallet',`${input('Amount','₱ 0.00','number','topupAmount')}<button class="btn btn-primary w-full" onclick="doTopup()">Continue</button><p class="small-label mt-3">Sample top-up only. No external payment provider is connected.</p>`)}
function doTopup(){let a=Number($('#topupAmount').value);if(!a||a<=0){toast('Enter a valid amount.');return}data.balance+=a;data.accounts[0].balance+=a;data.transactions.unshift({type:'Top Up',detail:'Demo wallet top up',amount:a,date:'Just now',positive:true});save();closeModal();render();toast('Demo balance updated.')}
function addAccount(){modal('Add New Account',`${input('Account Name','e.g. Travel Savings','text','newAcc')}<button class="btn btn-primary w-full" onclick="let n=$('#newAcc').value;if(!n){toast('Enter an account name.');return}data.accounts.push({name:n,number:'•••• '+Math.floor(1000+Math.random()*8999),balance:0});save();closeModal();render();toast('Account added.')">Add Account</button>`)}
function accountDetail(i){let a=data.accounts[i];modal(a.name,`<div class="tile mb-4"><div class="small-label">${a.number}</div><div class="stat mt-2">${money(a.balance)}</div></div><button class="btn btn-primary w-full" onclick="closeModal();transfer()">Transfer from this account</button>`)}
function investmentInfo(n){modal(n,`<p class="text-sm muted leading-6">Learn about ${n.toLowerCase()} before making financial decisions. Returns are not guaranteed and investments may involve risk.</p><button class="btn btn-primary w-full mt-5" onclick="closeModal();toast('Educational information opened.')">Got it</button>`)}
function settingsAction(n){if(n==='Personal Information'){modal(n,`${input('Full Name','Name','text','editName')}${input('Email','Email','email','editEmail')}<button class="btn btn-primary w-full" onclick="data.name=$('#editName').value||data.name;data.email=$('#editEmail').value||data.email;save();closeModal();render();toast('Profile updated.')">Save Changes</button>`)}else modal(n,`<p class="text-sm muted">This ${n.toLowerCase()} section is available as a local interface preview. External services are not connected.</p><button class="btn btn-primary w-full mt-5" onclick="closeModal()">Done</button>`)}
let deferredInstallPrompt=null;
const isIOSDevice=/iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
const isAndroid=/Android/i.test(navigator.userAgent);
const isChromeAndroid=isAndroid && /Chrome\//i.test(navigator.userAgent) && !/EdgA|OPR|SamsungBrowser/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  deferredInstallPrompt=event;
  document.querySelectorAll('.install-app-btn').forEach(button=>{button.disabled=false;button.setAttribute('aria-label','Install Monavest app');});
});
window.addEventListener('appinstalled',()=>{
  deferredInstallPrompt=null;
  toast('Monavest has been installed on your phone!');
});
function showInstallHelp(title,content){
  modal(title,`<div class="text-sm muted leading-6">${content}</div><button class="btn btn-primary w-full mt-5" onclick="closeModal()">Got it</button>`);
}
function installMonavest(){
  if(isStandalone()){
    toast('Monavest is already installed.');
    return;
  }
  if(!window.isSecureContext && location.hostname!=='localhost' && location.hostname!=='127.0.0.1'){
    showInstallHelp('Secure connection required','Monavest must be opened from its HTTPS website before it can be installed. Open the deployed HTTPS link, then tap Install Monavest App again.');
    return;
  }
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then(choice=>{
      if(choice.outcome==='accepted') toast('Installing Monavest…');
      else toast('You can install Monavest anytime from this button.');
      deferredInstallPrompt=null;
    }).catch(()=>showInstallHelp('Install Monavest','Open your browser menu and choose “Install app” or “Add to Home screen”.'));
    return;
  }
  if(isIOSDevice){
    showInstallHelp('Install Monavest on iPhone / iPad',
      '<ol class="list-decimal pl-5 space-y-2"><li>Open this website in <b class="text-white">Safari</b> (not an in-app browser such as Facebook or Messenger).</li><li>Tap the <b class="text-white">Share</b> button (the square with an upward arrow).</li><li>Scroll down and tap <b class="text-white">Add to Home Screen</b>. If needed, tap “Edit Actions” to find it.</li><li>Keep the name “Monavest”, then tap <b class="text-white">Add</b>.</li><li>Return to your Home Screen and open the Monavest icon.</li></ol><p class="mt-3 text-xs">iPhone does not provide a website-triggered install prompt. These Safari steps are required by iOS.</p>');
    return;
  }
  if(isAndroid){
    const browserSteps=isChromeAndroid
      ? 'In Chrome, tap the <b class="text-white">⋮ menu</b> in the top-right corner, then choose <b class="text-white">Install app</b> or <b class="text-white">Add to Home screen</b> and confirm.'
      : 'Open this same HTTPS link in <b class="text-white">Google Chrome</b>, then tap the <b class="text-white">⋮ menu</b> and choose <b class="text-white">Install app</b> or <b class="text-white">Add to Home screen</b>.';
    showInstallHelp('Install Monavest on Android',`<ol class="list-decimal pl-5 space-y-2"><li>${browserSteps}</li><li>Confirm the installation.</li><li>Find the Monavest icon on your Home Screen or app list.</li></ol><p class="mt-3 text-xs">If “Install app” is not shown, make sure the site is deployed over HTTPS and that the manifest and service worker files are available.</p>`);
    return;
  }
  showInstallHelp('Install Monavest', 'Open Monavest in a supported mobile browser over HTTPS. Use the browser menu and select “Install app” or “Add to Home screen”.');
}
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js', {scope:'/'}).catch(()=>{}));
}
</script></body></html>
